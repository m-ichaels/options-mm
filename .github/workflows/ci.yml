name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pyarrow duckdb scipy matplotlib fpdf2 websockets pybind11 setuptools pytest
      - name: build the C++ implied-vol extension
        run: python build_ext.py build_ext --inplace && python -c "from optmm import iv; assert iv.HAVE_EXT; print('extension ok')"
      - name: unit tests (pricing and the solver, SSVI/SVI fits and arbitrage checks, the engine on a synthetic tape, the tape reader)
        run: python -m pytest -q
      - name: the whole pipeline on the committed sample (tape surfaces, history, chains, the quoters, microstructure, RFQ)
        env:
          OPTMM_DATA: data/sample
          OPTMM_RESULTS: build/ci_results
        run: |
          python -m optmm run --quick
          python scripts/plots.py build/ci_results
          python scripts/summarize.py build/ci_results
          python scripts/report.py build/ci_results build/ci_results/report.pdf
      - name: the results notebook builds
        run: python scripts/make_notebook.py
